<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Lounge</title>
<!-- This site exists for the DOMAIN ROOT. Safari looks for a site's bookmark icon at the root
     (/favicon.ico, /apple-touch-icon.png), not inside a project page's folder, so a bookmark of
     hectorfsv.github.io/lounge/ fell back to a grey letter. The pages themselves live in their own
     repositories and are untouched: /lounge/ and /render-rig/. -->
<!-- 2026-09-18: the bookmark still drew a grey letter although every file here served 200 and decoded in real
     WebKit. Safari caches the ANSWER, not the file, and a deleted bookmark does not clear that. These names are ones
     it has never asked for; /favicon.ico and the rest stay on disk because that is the path Safari probes blind. -->
<link rel="icon" href="/icon-v2.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32-v2.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icon-16-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180-v2.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-title" content="The Lounge">
<meta name="theme-color" content="#0a0708">
<meta http-equiv="refresh" content="0; url=/lounge/">
<link rel="canonical" href="/lounge/">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#0a0708;color:#EDE6E3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    text-align:center;padding:24px}
  img{width:96px;height:96px;border:1px solid rgba(237,230,227,.18);display:block}
  h1{font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  a{color:#E01B1B;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;text-decoration:none;
    border:1px solid rgba(224,27,27,.5);padding:10px 18px}
  a:hover{border-color:#E01B1B}
</style>
</head>
<body>
  <img src="/apple-touch-icon.png" alt="">
  <h1>The Lounge</h1>
  <a href="/lounge/">Enter</a>
  <script>location.replace('/lounge/')</script>
</body>
</html>
